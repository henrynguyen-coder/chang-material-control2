<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#641b25">
  <title>CHANG Material Control - Ngoại tuyến</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8f5ef; color: #34252a; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 420px; }
    h1 { color: #641b25; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; background: #641b25; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>CHANG Material Control</h1>
    <p>Thiết bị đang ngoại tuyến. Hãy kết nối Internet để đăng nhập và đồng bộ dữ liệu nhà hàng.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
