services:
  - type: web
    name: chang-material-control2-web
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHANG_MATERIAL_INITIAL_ADMIN_PASSWORD
        sync: false
